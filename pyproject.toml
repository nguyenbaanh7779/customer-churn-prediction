[project]
name = "customer-churn-prediction"
version = "0.1.0"
description = "Customer churn prediction and retention marketing targeting — UCI Online Retail II"
requires-python = ">=3.10"

dependencies = [
    # Data
    "pandas==2.3.3",
    "pyarrow==21.0.0",
    "openpyxl==3.1.5",
    "jinja2>=3.1",
    # ML
    "numpy>=1.26,<2.0",        # pin <2.0 for compatibility with scikit-learn build
    "scikit-learn==1.6.1",
    "xgboost==2.1.4",
    "joblib>=1.4",
    # Visualisation
    "matplotlib==3.9.4",
    # App
    "streamlit==1.40.0",
]

# shap is only used in notebook 08 (SHAP plots) — not needed to run the app.
# Install separately when working in notebooks:  pip install shap==0.49.1
[project.optional-dependencies]
notebooks = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "notebook>=7.3",
    "shap>=0.46",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "notebook>=7.3",
]
